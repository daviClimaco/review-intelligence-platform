services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: davisenha123
      POSTGRES_DB: datareview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: datareview
      DB_USER: postgres
      DB_PASSWORD: davisenha123
    depends_on:
      - db

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: datareview
      DB_USER: postgres
      DB_PASSWORD: davisenha123
    depends_on:
      - db
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  postgres_data:
